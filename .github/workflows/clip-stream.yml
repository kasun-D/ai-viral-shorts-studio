name: AI Viral Shorts Studio v2 (Google Drive + YouTube)

on:
  workflow_dispatch:
    inputs:
      gdrive_video_url:
        description: "Google Drive Video Link (Share -> Anyone with the link)"
        required: false
        default: ""
        type: string
      youtube_url:
        description: "Optional YouTube URL (leave blank if using Google Drive link above)"
        required: false
        default: ""
        type: string
      genre:
        description: "Content Genre (leave on 'auto' to let AI detect it)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gaming
          - podcast
          - comedy
          - horror
          - entertainment
      layout:
        description: "9:16 Layout ('auto' picks best layout for the detected genre)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - blur_stack
          - auto_face_track
          - split_facecam
          - center_crop
      enable_voiceover:
        description: "Add Kokoro-82M Commercial-Safe AI Voiceover Hook (2-3s intro)"
        required: false
        default: false
        type: boolean
      num_clips:
        description: "How many viral Shorts to generate (e.g. 5)"
        required: false
        default: "5"
        type: string
      clip_duration:
        description: "Length of each Short in seconds (30 to 50)"
        required: false
        default: "45"
        type: string
      chat_lag_seconds:
        description: "Livestream chat delay offset in seconds (only used if YouTube live URL given)"
        required: false
        default: "18"
        type: string
      facecam_corner:
        description: "Facecam corner (only used if layout = split_facecam)"
        required: false
        default: "bottom_right"
        type: choice
        options:
          - bottom_right
          - bottom_left
          - top_right
          - top_left
      gdrive_folder:
        description: "Optional Google Drive output folder (leave blank to download ZIP from GitHub)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  models: read

jobs:
  generate-viral-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository (includes self-learning training_feedback.csv)
        uses: actions/checkout@v4

      - name: Free Extra Disk Space for Large Google Drive Videos
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Commercial-Safe Open-Source Stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet --upgrade \
            gdown yt-dlp faster-whisper opencv-python-headless numpy scikit-learn joblib scenedetect

      - name: Optional — Install Kokoro-82M AI Voiceover (Apache 2.0)
        if: ${{ inputs.enable_voiceover }}
        run: |
          sudo apt-get install -y -qq espeak-ng
          pip install --quiet kokoro soundfile

      - name: Download Video from Google Drive (if Google Drive link provided)
        if: ${{ inputs.gdrive_video_url != '' }}
        run: |
          gdown --fuzzy "${{ inputs.gdrive_video_url }}" -O input_video.mp4
          ls -lh input_video.mp4

      - name: Optional — Prepare YouTube Cookies Secret (if configured)
        env:
          YT_COOKIES_CONTENT: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES_CONTENT" ]; then
            printf "%s" "$YT_COOKIES_CONTENT" > cookies.txt
          fi

      - name: Run Universal AI Viral Clipper v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ -f input_video.mp4 ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --video-path input_video.mp4"
          fi
          if [ -n "${{ inputs.youtube_url }}" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --url ${{ inputs.youtube_url }}"
          fi
          if [ "${{ inputs.enable_voiceover }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --enable-voiceover"
          fi
          if [ -f cookies.txt ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --cookies cookies.txt"
          fi

          if [ ! -f input_video.mp4 ] && [ -z "${{ inputs.youtube_url }}" ]; then
            echo "ERROR: Please provide either a Google Drive video link or a YouTube URL."
            exit 1
          fi

          python3 viral_clipper.py \
            --genre "${{ inputs.genre }}" \
            --layout "${{ inputs.layout }}" \
            --facecam-corner "${{ inputs.facecam_corner }}" \
            --num-clips "${{ inputs.num_clips }}" \
            --clip-duration "${{ inputs.clip_duration }}" \
            --chat-lag "${{ inputs.chat_lag_seconds }}" \
            --whisper-model "base" \
            --out-dir "output_shorts" \
            $EXTRA_FLAGS

      - name: Save Updated Self-Learning Feedback Log to Repo
        run: |
          if [ -f training_feedback.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add training_feedback.csv
            git diff --staged --quiet || git commit -m "Log clip features for AI self-learning"
            git push || true
          fi

      - name: Upload Finished Shorts to GitHub (1-Click ZIP Download)
        uses: actions/upload-artifact@v4
        with:
          name: viral-shorts-pack
          path: output_shorts/
          retention-days: 14

      - name: Optional — Auto-Sync Finished Shorts to Google Drive via rclone
        if: ${{ inputs.gdrive_folder != '' }}
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_CONTENT" ]; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
            mkdir -p ~/.config/rclone
            printf "%s" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
            rclone copy output_shorts/ "gdrive:${{ inputs.gdrive_folder }}" --progress
          else
            echo "RCLONE_CONFIG secret not set; skipping Google Drive sync."
          fi
